# All configuration is inline — no host .env required for deploy.
# Deploy the FULL file (app + mysql + redis).
#
# Coolify: if MySQL stays unhealthy, delete persistent volume "mysql_data"
# (Storage → mysql volume → delete) then redeploy — old DB data keeps old passwords.

networks:
  culturekids:
    driver: bridge

services:
  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    networks:
      - culturekids

    environment:
      APP_NAME: "Paulette Culture Kids"
      APP_ENV: production
      APP_DEBUG: "true"
      APP_KEY: "base64:k3T6SGc/Lh1cSsYYjTqjAlXcPykicgi0XEK8mcxjwIc="
      APP_URL: "https://pualatte.kwatagig.com"
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: en_US
      APP_MAINTENANCE_DRIVER: file
      BCRYPT_ROUNDS: "12"

      LOG_CHANNEL: stack
      # stderr = visible in Coolify container logs; single = storage/logs/laravel.log
      LOG_STACK: stderr,single
      LOG_DEPRECATIONS_CHANNEL: "null"
      LOG_LEVEL: debug

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: paulette
      DB_USERNAME: paulette
      DB_PASSWORD: "PauletteKwatagig2024"

      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      SESSION_DRIVER: redis
      SESSION_LIFETIME: "120"
      SESSION_ENCRYPT: "false"
      SESSION_PATH: /
      CACHE_STORE: redis
      QUEUE_CONNECTION: database

      # First deploy only — set to "true" once, redeploy, then set back to "false" (seed blocks HTTP for minutes → 504)
      RUN_DB_SEED: "false"
      RUN_VIEW_CACHE: "false"
      RUN_ROUTE_CACHE: "false"
      DB_WAIT_ATTEMPTS: "30"
      DB_WAIT_SLEEP: "2"

      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local

      MAIL_MAILER: smtp
      MAIL_ENCRYPTION: ssl
      MAIL_HOST: server72.web-hosting.com
      MAIL_PORT: "465"
      MAIL_USERNAME: info@yilibapro.com
      MAIL_PASSWORD: "Mirinda@123"
      MAIL_FROM_ADDRESS: info@yilibapro.com
      MAIL_FROM_NAME: "Paulette Culture Kids"

      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ""
      AWS_USE_PATH_STYLE_ENDPOINT: "false"

      VITE_APP_NAME: "Paulette Culture Kids"

      # Push notifications (mobile app registers Expo tokens via /api/v1/push/devices/register)
      # log = no-op (default safe) | expo = Expo Push API | fcm = legacy FCM | composite = both
      PUSH_PROVIDER: expo
      PUSH_FCM_URL: "https://fcm.googleapis.com/fcm/send"
      PUSH_FCM_SERVER_KEY: ""

    ports:
      - "7000:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    networks:
      culturekids:
        aliases:
          - mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: paulette
      MYSQL_USER: paulette
      MYSQL_PASSWORD: "PauletteKwatagig2024"
      MYSQL_ROOT_PASSWORD: "PauletteRootKwatagig2024"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pPauletteRootKwatagig2024"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - culturekids
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  app_storage:
