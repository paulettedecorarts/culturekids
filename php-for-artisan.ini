; Loaded only when you start PHP with: php -c php-for-artisan.ini artisan serve
; (see composer.json "serve" / "dev"). Fixes Livewire /livewire/upload-file 422 when
; the global php.ini still has upload_max_filesize=2M.
upload_max_filesize = 8192M
post_max_size = 8192M
max_file_uploads = 50
max_execution_time = 600
max_input_time = 600
memory_limit = 512M
