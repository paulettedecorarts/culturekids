user www-data;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 8192M;

    # Alpine default /var/lib/nginx/tmp is not writable by www-data workers — breaks uploads & fastcgi buffering.
    client_body_temp_path /tmp/nginx/client_body;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    proxy_temp_path       /tmp/nginx/proxy;

    log_format upload_trace '$remote_addr - $status $request_method $request_uri '
                            'cl=$content_length rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout upload_trace;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_connect_timeout 60;
            fastcgi_send_timeout 600;
            fastcgi_read_timeout 600;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
