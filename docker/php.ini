upload_max_filesize = 8192M
post_max_size = 8192M
max_file_uploads = 50
; Use app storage (volume) so PHP can stage multipart uploads before Livewire moves them.
upload_tmp_dir = /var/www/html/storage/app/livewire-tmp
max_execution_time = 0
max_input_time = 600
memory_limit = 512M
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
